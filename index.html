<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKJCN - Customer Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-line:#DCD5C3;
    --card:#FFFDF8;
    --ink:#232323;
    --ink-soft:#5B564B;
    --ink-faint:#8E8878;
    --teal:#0F5E56;
    --teal-deep:#0A413C;
    --paid-green:#1E7D4F;
    --unpaid-red:#B23A2E;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter','Noto Sans Telugu',sans-serif;
    min-height:100vh;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 22px;gap:12px;
  }
  .brand{font-family:'Fraunces',serif;font-weight:600;font-size:18px;}
  .right{display:flex;align-items:center;gap:12px;}
  .status{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
    text-align:right;
  }
  .status .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:#9a9584;margin-right:6px;
  }
  .status.live .dot{background:var(--teal);}
  .status.error .dot{background:var(--unpaid-red);}
  button.refresh{
    font-size:16px;background:transparent;border:2px solid var(--ink);color:var(--ink);
    width:32px;height:32px;padding:0;border-radius:6px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;line-height:1;
  }
  button.refresh:hover{background:var(--ink);color:var(--paper);}

  /* ---------- search ---------- */
  main{max-width:720px;margin:0 auto;padding:0 20px 90px;}

  .hero{padding-top:19vh;transition:padding-top .28s ease;}
  .has-query .hero{padding-top:6px;}
  .hero h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:36px;line-height:1.15;
    text-align:center;margin:0 0 24px;max-height:60px;overflow:hidden;
    transition:opacity .2s ease, max-height .28s ease, margin .28s ease;
  }
  .has-query .hero h1{opacity:0;max-height:0;margin:0;}

  .searchbox{
    display:flex;align-items:center;height:58px;
    padding:0 10px 0 20px;
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:999px;
    box-shadow:0 2px 14px rgba(35,35,35,.08);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .searchbox:focus-within{
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(15,94,86,.16), 0 2px 14px rgba(35,35,35,.08);
  }
  .searchbox .ico{width:20px;height:20px;flex:none;color:var(--ink-soft);}
  .searchbox input{
    flex:1;min-width:0;height:100%;
    border:0;outline:0;background:transparent;
    font:inherit;font-size:17px;color:var(--ink);
    padding:0 12px;
  }
  .searchbox input::placeholder{color:var(--ink-faint);}
  .clear{
    display:none;width:34px;height:34px;flex:none;
    border:0;border-radius:50%;background:var(--paper);color:var(--ink-soft);
    font-size:20px;line-height:1;cursor:pointer;
    align-items:center;justify-content:center;
  }
  .clear:hover{background:var(--paper-line);}
  .has-query .clear{display:inline-flex;}

  .meta{
    margin:18px 4px 12px;min-height:18px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
  }

  /* ---------- result cards ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:14px;
    padding:16px 18px 18px;
    margin-bottom:12px;
  }
  .card-head{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding-bottom:12px;margin-bottom:14px;
    border-bottom:1px solid var(--paper-line);
  }
  .card-name{font-size:20px;font-weight:600;line-height:1.25;}
  mark{background:rgba(15,94,86,.18);color:inherit;border-radius:3px;padding:0 1px;}
  .pill{
    flex:none;font-size:12.5px;font-weight:500;
    border:1px solid currentColor;border-radius:999px;padding:3px 11px;
  }
  .pill.ok{color:var(--paid-green);}
  .pill.bad{color:var(--unpaid-red);}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;}
  .field{min-width:0;}
  .field.wide{grid-column:1 / -1;}
  .label{font-size:12.5px;color:var(--ink-soft);margin-bottom:2px;}
  .value{font-size:15px;line-height:1.4;overflow-wrap:anywhere;}
  .value.mono{font-family:'IBM Plex Mono',monospace;font-size:14px;}
  .value.empty{color:var(--ink-faint);}
  .value a{color:var(--teal-deep);text-decoration:none;border-bottom:1px solid var(--paper-line);}
  .value a:hover{border-bottom-color:var(--teal);}

  .none{
    padding:36px 10px;text-align:center;color:var(--ink-soft);font-size:15px;line-height:1.5;
  }
  .more-wrap{text-align:center;margin-top:8px;}
  .more-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    background:transparent;border:1.5px solid var(--ink);color:var(--ink);
    padding:9px 18px;border-radius:999px;cursor:pointer;
  }
  .more-btn:hover{background:var(--ink);color:var(--paper);}

  .setup-banner{
    background:#FBF6E9;border:1px solid #E8DDB0;border-radius:10px;
    padding:14px 16px;margin:0 0 22px;font-size:13.5px;line-height:1.6;
  }
  .setup-banner code{background:#F0E9D2;padding:2px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12px;}

  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  @media (max-width:560px){
    .topbar{padding:12px 16px;}
    main{padding:0 14px 80px;}
    .hero{padding-top:14vh;}
    .hero h1{font-size:30px;}
    .searchbox{height:54px;padding-left:16px;}
    .searchbox input{font-size:16px;}   /* 16px stops iPhone auto-zoom */
    .card{padding:14px 14px 16px;}
    .grid{gap:12px 16px;}
    .status{max-width:150px;font-size:11px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">SKJCN</div>
  <div class="right">
    <div class="status" id="status"><span class="dot"></span><span id="statusText">connecting…</span></div>
    <button class="refresh" id="refreshBtn" aria-label="Reload customer list" title="Reload customer list">↻</button>
  </div>
</div>

<main id="app">
  <div class="setup-banner" id="setupBanner" hidden>
    Demo mode: showing 8 sample customers because no sheet is connected yet.
    Paste your Apps Script Web app URL into <code>SCRIPT_URL</code> near the top of the
    <code>&lt;script&gt;</code> section of this file, then reload.
  </div>

  <section class="hero">
    <h1>Find a customer</h1>
    <div class="searchbox">
      <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input id="q" type="text" placeholder="Search by customer name" aria-label="Search customers by name"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
             enterkeyhint="search" inputmode="search" autofocus>
      <button class="clear" id="clearBtn" type="button" aria-label="Clear search">×</button>
    </div>
  </section>

  <div class="meta" id="meta" aria-live="polite"></div>
  <div id="results"></div>
  <div class="more-wrap"><button class="more-btn" id="moreBtn" type="button" hidden></button></div>
</main>

<script>
  // ============================================================
  // 1) Paste your deployed Apps Script Web app URL below.
  //    Leave blank to try the page with built-in demo data.
  // ============================================================
  const SCRIPT_URL = "";   // e.g. "https://script.google.com/macros/s/AKfycb.../exec"

  const NAME_COL   = "cust_name";   // the sheet column that is searched
  const PAGE_SIZE  = 30;            // cards drawn at a time
  const REFRESH_MS = 5 * 60 * 1000; // quietly re-check the sheet every 5 minutes

  const DEMO = {
    headers: ["cust_id","cust_name","phone","alt_phone","address","area","pack_name","pack_price","connection_date","status","notes"],
    updated: 0,
    rows: [
      ["C0001","Ravi Kumar","9876543210","","12-4/1, 1st Cross, Gandhi Nagar","Gandhi Nagar","Gold Package","4999","05-Jan-2024","Active",""],
      ["C0002","Ravi Teja Reddy","9876501234","9123456780","7-22, Temple Street","Kothapeta","Silver Package","2999","11-Mar-2023","Active","Prefers evening visits"],
      ["C0003","Sri Lakshmi Naidu","9988776655","","33-1/2, Park Road","Park Road","Basic Package","1499","19-Aug-2025","Inactive",""],
      ["C0004","Venkata Ramana Rao","9000011122","9000033344","5-9, Bus Stand Road","Main Road","Platinum Package","7999","02-Feb-2022","Active","Static IP"],
      ["C0005","Suresh Babu","9345612780","","18-7/3, Railway Colony","Railway Colony","Silver Package","2999","27-Jun-2025","Suspended","Payment pending"],
      ["C0006","Priya Chowdary","9700012345","","44, Ashok Nagar","Ashok Nagar","Gold Package","4999","14-Nov-2023","Active",""],
      ["C0007","Kiran Kumar","9811122233","","9-3, Market Yard","Market Yard","Basic Package","1499","08-Apr-2026","Active","Router replaced"],
      ["C0008","Anitha Sharma","9922233344","","61-2, Indira Colony","Indira Colony","Silver Package","2999","30-Sep-2024","Active",""]
    ]
  };

  const LABELS = {
    cust_id:"Customer ID", cust_name:"Name", phone:"Phone", alt_phone:"Alternate phone",
    address:"Address", area:"Area", pack_name:"Package", pack_price:"Price",
    connection_date:"Connected since", status:"Status", notes:"Notes"
  };

  // =====================================================================
  //  SEARCH CORE — the part that makes it fast. No DOM in here.
  //  * The whole list is already in memory, so nothing is sent to the server
  //    while you type.
  //  * Names are lower-cased ONCE and sorted A→Z when the list loads.
  //  * Each keystroke is one pass of String.indexOf over plain strings.
  //  * While you keep typing the same name ("ra" → "rav" → "ravi"), only the
  //    previous matches are re-checked, so every extra letter is cheaper.
  //  * Results are bucketed (starts-with → word-starts-with → contains), so no
  //    sorting is needed at search time.
  // =====================================================================
  // <search-core>
  let hay = [];             // normalized names, sorted A→Z
  let lastQ = '', lastCand = null;

  function norm(s){
    return String(s).toLowerCase().replace(/[^\p{L}\p{N}\p{M}]+/gu, ' ').trim();
  }

  // Normalizes + sorts rows by name and builds the lookup array. Returns the sorted rows.
  function buildIndex(rows, nameIdx){
    const recs = rows.map(r => ({ r, k: norm(r[nameIdx] || '') }));
    recs.sort((a, b) => a.k < b.k ? -1 : a.k > b.k ? 1 : 0);
    hay = recs.map(x => x.k);
    lastQ = ''; lastCand = null;
    return recs.map(x => x.r);
  }

  // Returns { q, toks, idx } where idx = row positions, best matches first.
  function search(raw){
    const q = norm(raw);
    if (!q){ lastQ = ''; lastCand = null; return { q:'', toks:[], idx:[] }; }
    const toks = q.split(' ');
    const sp = toks.map(t => ' ' + t);
    const src = (lastCand && lastQ && q.startsWith(lastQ)) ? lastCand : null;
    const n = src ? src.length : hay.length;
    const b0 = [], b1 = [], b2 = [], cand = [];

    for (let i = 0; i < n; i++){
      const idx = src ? src[i] : i;
      const h = hay[idx];
      let ok = true;
      for (let t = 0; t < toks.length; t++){
        if (h.indexOf(toks[t]) === -1){ ok = false; break; }
      }
      if (!ok) continue;
      cand.push(idx);
      if (h.startsWith(q)){ b0.push(idx); continue; }
      let wordStart = true;
      for (let t = 0; t < toks.length; t++){
        if (!(h.startsWith(toks[t]) || h.indexOf(sp[t]) !== -1)){ wordStart = false; break; }
      }
      (wordStart ? b1 : b2).push(idx);
    }
    lastQ = q; lastCand = cand;
    return { q, toks, idx: b0.concat(b1, b2) };
  }
  // </search-core>

  // ---------------------------------------------------------------------
  //  Page code
  // ---------------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const app = $('app'), input = $('q'), clearBtn = $('clearBtn'), metaEl = $('meta');
  const resultsEl = $('results'), moreBtn = $('moreBtn');
  const statusEl = $('status'), statusText = $('statusText'), refreshBtn = $('refreshBtn');

  let headers = [], data = [], nameIdx = -1, statusIdx = -1, colKind = [];
  let ready = false, loadedStamp = null;
  let results = [], shown = 0, curRe = null;

  const ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  const esc = s => String(s).replace(/[&<>"']/g, c => ESC[c]);
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  function fmtPrice(v){
    const n = Number(v);
    return isNaN(n) ? esc(v) : '₹' + n.toLocaleString('en-IN');
  }
  function labelFor(h){
    if (LABELS[h]) return LABELS[h];
    const s = h.replace(/_/g, ' ').trim();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function setStatus(mode, text){
    statusEl.className = 'status ' + mode;
    statusText.textContent = text;
  }
  const count = () => data.length.toLocaleString('en-IN');
  const clock = () => new Date().toLocaleTimeString();

  // Loads a { headers, rows } payload into the search index.
  function setData(d){
    const h = (d.headers || []).map(x => String(x).trim());
    const ni = h.indexOf(NAME_COL);
    if (ni < 0){
      setStatus('error', 'column "' + NAME_COL + '" not found in the sheet');
      return false;
    }
    headers = h; nameIdx = ni;
    statusIdx = h.indexOf('status');
    colKind = h.map(x => {
      const k = x.toLowerCase();
      if (k.includes('price')) return 'price';
      if (k.includes('phone')) return 'phone';
      if (k.endsWith('_id') || k.includes('date')) return 'mono';
      return 'text';
    });
    data = buildIndex(d.rows || [], ni);
    ready = true;
    return true;
  }

  function highlight(text){
    if (!curRe) return esc(text);
    return text.split(curRe).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
  }

  function fieldHtml(i, v){
    const wide = headers[i].toLowerCase() === 'address' || headers[i].toLowerCase() === 'notes' || v.length > 40;
    let val;
    if (v === '') val = '<div class="value empty">—</div>';
    else if (colKind[i] === 'price') val = '<div class="value mono">' + fmtPrice(v) + '</div>';
    else if (colKind[i] === 'phone') val = '<div class="value mono"><a href="tel:' + esc(v.replace(/[^\d+]/g, '')) + '">' + esc(v) + '</a></div>';
    else if (colKind[i] === 'mono') val = '<div class="value mono">' + esc(v) + '</div>';
    else val = '<div class="value">' + esc(v) + '</div>';
    return '<div class="field' + (wide ? ' wide' : '') + '"><div class="label">' + esc(labelFor(headers[i])) + '</div>' + val + '</div>';
  }

  function cardHtml(idx){
    const r = data[idx];
    let pill = '';
    if (statusIdx >= 0 && r[statusIdx]){
      const ok = String(r[statusIdx]).toLowerCase() === 'active';
      pill = '<span class="pill ' + (ok ? 'ok' : 'bad') + '">' + esc(r[statusIdx]) + '</span>';
    }
    let fields = '';
    for (let i = 0; i < headers.length; i++){
      if (i === nameIdx || i === statusIdx) continue;
      fields += fieldHtml(i, r[i] == null ? '' : String(r[i]));
    }
    return '<article class="card"><div class="card-head"><div class="card-name">' + highlight(String(r[nameIdx] || '')) +
           '</div>' + pill + '</div><div class="grid">' + fields + '</div></article>';
  }

  function renderBatch(){
    const end = Math.min(shown + PAGE_SIZE, results.length);
    let html = '';
    for (let i = shown; i < end; i++) html += cardHtml(results[i]);
    resultsEl.insertAdjacentHTML('beforeend', html);
    shown = end;
    const left = results.length - shown;
    moreBtn.hidden = left <= 0;
    if (left > 0) moreBtn.textContent = 'Show ' + Math.min(PAGE_SIZE, left) + ' more (' + left.toLocaleString('en-IN') + ' left)';
  }

  function run(){
    const raw = input.value;
    const has = raw.trim() !== '';
    app.classList.toggle('has-query', has);

    resultsEl.innerHTML = ''; moreBtn.hidden = true; shown = 0; results = [];

    if (!has){
      search('');
      metaEl.textContent = ready ? count() + ' customers' : '';
      return;
    }
    if (!ready){ metaEl.textContent = 'Loading customers…'; return; }

    const t0 = performance.now();
    const s = search(raw);
    const ms = performance.now() - t0;
    results = s.idx;
    curRe = new RegExp('(' + s.toks.slice().sort((a, b) => b.length - a.length).map(escRe).join('|') + ')', 'giu');

    if (!results.length){
      metaEl.textContent = '0 matches';
      resultsEl.innerHTML = '<div class="none">No customer found for “' + esc(raw.trim()) +
        '”.<br>Check the spelling, or try fewer letters.</div>';
      return;
    }
    metaEl.textContent = results.length.toLocaleString('en-IN') + (results.length === 1 ? ' match' : ' matches') +
                         ' in ' + (ms < 1 ? '<1' : ms.toFixed(0)) + ' ms';
    renderBatch();
  }

  // run() at most once per frame, however fast keys arrive
  let raf = 0;
  function schedule(){ if (!raf) raf = requestAnimationFrame(() => { raf = 0; run(); }); }

  input.addEventListener('input', schedule);
  clearBtn.addEventListener('click', () => { input.value = ''; run(); input.focus(); });
  moreBtn.addEventListener('click', renderBatch);
  input.addEventListener('keydown', e => { if (e.key === 'Escape' && input.value){ input.value = ''; run(); } });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== input && !e.metaKey && !e.ctrlKey){ e.preventDefault(); input.focus(); }
  });

  // ---------------- saved copy in the browser (IndexedDB) ----------------
  // The page opens with last visit's list instantly, then updates quietly.
  const DB_NAME = 'skjcn-customers', STORE = 'kv', CACHE_KEY = 'data:' + SCRIPT_URL;
  function openDb(){
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbGet(k){
    try{
      const db = await openDb();
      return await new Promise((res, rej) => {
        const q = db.transaction(STORE).objectStore(STORE).get(k);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    }catch(e){ return null; }
  }
  async function idbSet(k, v){
    try{
      const db = await openDb();
      await new Promise((res, rej) => {
        const t = db.transaction(STORE, 'readwrite');
        t.objectStore(STORE).put(v, k);
        t.oncomplete = res; t.onerror = () => rej(t.error);
      });
    }catch(e){}
  }

  // ---------------- loading from the sheet ----------------
  async function refresh(fresh, silent){
    if (!silent) setStatus('', 'reloading…');
    try{
      const url = SCRIPT_URL + (fresh ? (SCRIPT_URL.includes('?') ? '&' : '?') + 'fresh=1' : '');
      const res = await fetch(url);
      const d = await res.json();
      if (!d || !d.headers) throw new Error('unexpected reply from the script');
      if (!ready || d.updated !== loadedStamp){
        if (!setData(d)) return;
        loadedStamp = d.updated;
        idbSet(CACHE_KEY, d);
        run();
      }
      setStatus('live', count() + ' customers, updated ' + clock());
    }catch(err){
      console.error(err);
      setStatus('error', ready ? 'offline, using saved list' : 'could not reach the sheet');
    }
  }

  async function init(){
    if (!SCRIPT_URL){
      $('setupBanner').hidden = false;
      setData(DEMO);
      setStatus('', 'demo data, not connected');
      run();
      return;
    }
    const fetching = refresh(false, true);     // start the download right away…
    const cached = await idbGet(CACHE_KEY);    // …while the saved copy loads
    if (!ready && cached && cached.rows && setData(cached)){
      loadedStamp = cached.updated;
      setStatus('', count() + ' customers, saved copy');
      run();
    }
    await fetching;
    setInterval(() => refresh(false, true), REFRESH_MS);
  }

  refreshBtn.addEventListener('click', () => refresh(true, false));  // fresh=1 skips the server cache
  init();
</script>
</body>
</html>
